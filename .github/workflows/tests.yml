name: Tests

# Run on every push to any branch, and on pull requests into master.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        # A login shell is needed for the conda environment to be active.
        shell: bash -el {0}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the swe4s environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: swe4s

      - name: Style checks
        run: pycodestyle src/*.py test/unit/*.py

      - name: Unit tests
        run: python -m unittest discover -s test/unit -v

      - name: Functional tests
        run: bash test/func/test_print_fires.sh
